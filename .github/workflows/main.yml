name: CI/CD

on:
  push:
  pull_request:

env:
  PROJECT_NAME: open-mmc
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}/open-mmc
  DOCKER_TAG: ${{ github.sha }}
  KUBERNETES_NAMESPACE: pt

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Deploy Test
  deploy-test:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: test
    environment: test
    concurrency: deploy-test
    permissions:
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build and push images
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          working-directory: infrastructure
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/shrink/actions-docker-registry-tag
      - name: Add a "unstable" docker tag
        uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/open-mmc
          target: ${{ env.DOCKER_TAG }}
          tags: |
            unstable

      - name: Customize values.yaml
        run: |
          yq -i '.image.tag="${{ env.DOCKER_TAG }}"' infrastructure/helm/test.yaml
          yq -i '.secretEnv.ODH_CLIENT_ID="${{ secrets.ODH_CLIENT_ID }}"' infrastructure/helm/test.yaml
          yq -i '.secretEnv.ODH_CLIENT_SECRET="${{ secrets.ODH_CLIENT_SECRET }}"' infrastructure/helm/test.yaml

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v2
        with:
          k8s-name: open-mmc
          k8s-namespace: ${{ env.KUBERNETES_NAMESPACE }}
          chart-path: infrastructure/helm/open-mmc
          values-file: infrastructure/helm/test.yaml
          aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEV_ACCESS_KEY_SECRET }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1
