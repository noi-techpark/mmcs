services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      ADDR: ":8080"
      # Optional — see .env.example. Unset is fine; authenticated ODH
      # features just stay unavailable (see backend/internal/odhauth).
      ODH_CLIENT_ID: "${ODH_CLIENT_ID:-}"
      ODH_CLIENT_SECRET: "${ODH_CLIENT_SECRET:-}"
      ODH_TOKEN_URL: "${ODH_TOKEN_URL:-}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      BACKEND_HOST: "backend:8080"
    depends_on:
      - backend
