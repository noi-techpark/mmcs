# image.tag is set at deploy time by the CI/CD workflow (see .github/workflows/main.yml).
image:
  tag: ""

# ODH_CLIENT_ID / ODH_CLIENT_SECRET are patched into secretEnv at deploy
# time by the CI/CD workflow, from GitHub Actions repo secrets.
env:
  # Realm-specific — must match whichever realm ODH_CLIENT_ID/SECRET (repo
  # secrets, patched into secretEnv above) are registered in. See
  # .env.example for the test-realm alternative.
  ODH_TOKEN_URL: "https://auth.opendatahub.com/auth/realms/noi/protocol/openid-connect/token"

ingress:
  enabled: true
  className: nginx
  # TLS is terminated by the proxy (proxy-02), which forwards plain HTTP here.
  # A tls section would make nginx redirect to https and loop.
  hosts:
    - host: mmcs.opendatahub.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    memory: 1Gi
    cpu: 20m
  limits:
    memory: 2Gi
