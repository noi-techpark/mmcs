# image.tag is set at deploy time by the CI/CD workflow (see .github/workflows/main.yml).
image:
  tag: ""

# ODH_CLIENT_ID / ODH_CLIENT_SECRET are patched into secretEnv at deploy
# time by the CI/CD workflow, from GitHub Actions repo secrets.
env:
  ODH_TOKEN_URL: "https://auth.opendatahub.testingmachine.eu/auth/realms/noi/protocol/openid-connect/token"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
  tls:
    - hosts:
        - mmcs.dev.testingmachine.eu
      secretName: tls-open-mmc
  hosts:
    - host: mmcs.dev.testingmachine.eu
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    memory: 512Mi
    cpu: 20m
  limits:
    memory: 896Mi
