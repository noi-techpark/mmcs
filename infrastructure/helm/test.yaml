# image.tag is set at deploy time by the CI/CD workflow (see .github/workflows/main.yml).
image:
  tag: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
  tls:
    - hosts:
        - mmcs.dev.testingmachine.eu
      secretName: tls-open-mmc
  hosts:
    - host: mmcs.dev.testingmachine.eu
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 512Mi
